plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.ktlint) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.kover) apply true
}

// Aggregate Kover reports across modules so `./gradlew koverHtmlReport` produces a single,
// project-wide coverage report rooted at the repository.
dependencies {
    kover project(':app')
}

// Apply ktlint and detekt to every subproject so the rules are enforced uniformly.
subprojects {
    apply plugin: 'org.jlleitschuh.gradle.ktlint'
    apply plugin: 'io.gitlab.arturbosch.detekt'

    detekt {
        config.setFrom(rootProject.file('config/detekt/detekt.yml'))
        buildUponDefaultConfig = true
        autoCorrect = false
    }

    dependencies {
        detektPlugins libs.detekt.formatting
    }
}
