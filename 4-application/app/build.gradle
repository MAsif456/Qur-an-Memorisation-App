plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kover)
}

android {
    compileSdk 35
    namespace 'com.example.mob_dev_portfolio'

    defaultConfig {
        applicationId 'com.example.mob_dev_portfolio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Bundled JSON only, no need to run aapt on Arabic resources.
        resourceConfigurations += ['en']
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'WHISPER_BASE_URL', '""'
        }
        release {
            buildConfigField 'String', 'WHISPER_BASE_URL', '""'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    // AndroidX core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.swiperefresh

    // Lifecycle & Navigation
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Coroutines
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.fragment
    implementation libs.hilt.work
    ksp libs.hilt.androidx.compiler

    // Networking
    implementation libs.retrofit.core
    implementation libs.retrofit.converter.moshi
    implementation libs.okhttp.core
    implementation libs.okhttp.logging
    implementation libs.moshi.kotlin
    ksp libs.moshi.codegen

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // DataStore
    implementation libs.androidx.datastore.preferences

    // Media3
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.common
    implementation libs.androidx.media3.session

    // WorkManager
    implementation libs.androidx.work.runtime.ktx

    // Unit tests
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.mockk
    testImplementation libs.turbine
    testImplementation libs.robolectric
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.hilt.android.testing
    kspTest libs.hilt.compiler

    // Instrumented tests
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.espresso.contrib
    androidTestImplementation libs.androidx.espresso.intents
    androidTestImplementation libs.androidx.fragment.testing
    androidTestImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.truth
    androidTestImplementation libs.mockk.android
    androidTestImplementation libs.room.testing
    androidTestImplementation libs.androidx.work.testing
    androidTestImplementation libs.hilt.android.testing
    androidTestImplementation libs.okhttp.mockwebserver
    kspAndroidTest libs.hilt.compiler
}

// Coverage exclusions: nothing meaningful is asserted about generated/UI binding glue,
// dependency-injection wiring, or platform entry points.
kover {
    reports {
        filters {
            excludes {
                classes(
                    '*_HiltModules*',
                    '*_Factory*',
                    '*_Impl*',
                    '*Hilt_*',
                    'hilt_aggregated_deps.*',
                    'dagger.hilt.internal.*',
                    '*.databinding.*',
                    '*.BuildConfig'
                )
                packages(
                    'com.example.mob_dev_portfolio.di',
                    'com.example.mob_dev_portfolio.ui.*.databinding'
                )
                annotatedBy('dagger.hilt.android.HiltAndroidApp')
            }
        }
    }
}
